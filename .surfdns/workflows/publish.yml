# A vX.Y.Z tag publishes @flybyme/mesh@X.Y.Z to the platform's registry (design/workflows.md).
# npm-publish checks the tag is the version, and publishes with the job's own token: the registry
# records which repository, commit and run each version came from.
# Tests are not run here yet: some need a MongoDB the job does not have.
name: publish
on:
  push:
    tags: ['v*']
  manual: true
jobs:
  publish:
    image: node:22
    memory: 2Gi
    steps:
      - name: install and build
        run: npm ci
      - name: publish
        uses: npm-publish
