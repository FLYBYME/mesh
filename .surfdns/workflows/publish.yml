# A vX.Y.Z tag publishes @flybyme/mesh@X.Y.Z to registry.surfdns.net (design/workflows.md).
# Tests are not run here yet: some need a MongoDB the job does not have.
name: publish
on:
  push:
    tags: ['v*']
  manual: true
jobs:
  publish:
    image: node:22
    memory: 2Gi
    steps:
      - name: the tag is the version
        run: test "v$(node -p 'require("./package.json").version')" = "${{ git.tag }}"
      - name: install and build
        run: npm ci
      - name: publish
        run: |
          echo "//registry.surfdns.net/:_authToken=${REGISTRY_TOKEN}" > "$HOME/.npmrc"
          npm publish
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
