<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Browser Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #121212;
            color: #ffffff;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        h1 { margin-top: 0; color: #4ade80; }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background: #4ade80;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #22c55e; }
        button:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
        pre {
            background: #000;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            color: #a78bfa;
            font-family: monospace;
            min-height: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mesh Client SDK</h1>
        <p>This demo connects directly to the Mesh Engine over WebSocket using the auto-generated Client SDK.</p>
        
        <div class="form-group">
            <input type="text" id="name-input" placeholder="Enter your name" value="Browser Explorer">
            <button id="run-btn">Run Tool</button>
        </div>

        <pre id="output"></pre>
    </div>

    <script type="module" src="./app.bundle.js"></script>
</body>
</html>
