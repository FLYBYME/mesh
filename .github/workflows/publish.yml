name: Publish to GitHub Packages

# Tags only. This used to also fire on every push to master, which meant the version in
# package.json was the only thing standing between a routine merge and a publish -- and when it
# had not been bumped, the run failed on a version conflict rather than doing nothing, so a red
# X on master became normal and stopped meaning anything.
#
# A release is now an explicit act: bump the version, merge it, tag it. The tag is the trigger and
# the tag is the record of what was released.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@flybyme'

      - name: Verify the tag matches the version in package.json
        # Without this, `git tag v2.0.1` on a tree that still says 2.0.0 publishes 2.0.0 -- or
        # fails on a conflict -- and the tag becomes a lie about what is on the registry.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}."
            echo "Bump package.json to ${TAG_VERSION} (or retag as v${PKG_VERSION}) and try again."
            exit 1
          fi
          echo "Publishing ${PKG_VERSION} from ${GITHUB_REF_NAME}."

      - run: npm install

      - run: npm run build

      # A tag that fails its own tests must not reach the registry. Consumers install by version
      # and cannot tell a green release from a red one.
      - run: npm test

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
