name: CI

# Publishing moved to tags, so master needed a check of its own -- this is the one to require in
# the branch protection rule for master.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # 71 of the 299 tests talk to a real MongoDB. They passed locally and had never once run on a
    # runner, because until now no workflow ran the tests at all -- publish.yml only built and
    # published. A service container is the honest fix: the suite is not a unit suite and
    # pretending otherwise would mean deleting the coverage that matters most.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - run: npm install

      - name: Typecheck and build
        run: npm run build

      # The suite's failure mode is a jest hook timeout, which says nothing about *why* the
      # database is unreachable -- raising the timeout from 5s to 30s changed the number in the
      # message and nothing else. This connects with a short, explicit server-selection timeout so
      # the driver reports its own error, with an address, before the suite buries it.
      - name: Probe MongoDB
        run: |
          node -e "
          const { MongoClient } = require('mongodb');
          const uri = process.env.MONGODB_URI;
          console.log('connecting to', uri);
          new MongoClient(uri, { serverSelectionTimeoutMS: 8000 }).connect()
            .then(c => c.db('probe').command({ ping: 1 }).then(r => {
              console.log('ping ok', JSON.stringify(r));
              return c.close();
            }))
            .catch(e => { console.error('PROBE FAILED:', e.name, e.message); process.exit(1); });
          "

      - run: npm test
