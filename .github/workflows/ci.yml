name: CI

# Publishing moved to tags, so master needed a check of its own -- this is the one to require in
# the branch protection rule for master.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # 71 of the 299 tests talk to a real MongoDB. They passed locally and had never once run on a
    # runner, because until now no workflow ran the tests at all -- publish.yml only built and
    # published. A service container is the honest fix: the suite is not a unit suite and
    # pretending otherwise would mean deleting the coverage that matters most.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - run: npm install

      - name: Typecheck and build
        run: npm run build

      # The suite's failure mode is a jest hook timeout, which says nothing about *why* the
      # database is unreachable -- raising the timeout from 5s to 30s changed the number in the
      # message and nothing else. This connects with a short, explicit server-selection timeout so
      # the driver reports its own error, with an address, before the suite buries it.
      - name: Probe MongoDB
        run: |
          node -e "
          const { MongoClient } = require('mongodb');
          const uri = process.env.MONGODB_URI;
          console.log('connecting to', uri);
          new MongoClient(uri, { serverSelectionTimeoutMS: 8000 }).connect()
            .then(c => c.db('probe').command({ ping: 1 }).then(r => {
              console.log('ping ok', JSON.stringify(r));
              return c.close();
            }))
            .catch(e => { console.error('PROBE FAILED:', e.name, e.message); process.exit(1); });
          "

      - run: npm test

      # `@flybyme/mesh/contracts` is the entry browser code loads to get *this package's* zod —
      # which matters because zod's type checks are `instanceof`, so two copies on one page fail
      # every check made across them. Its whole value is that it pulls in nothing but zod.
      #
      # That property is invisible to `tsc`: an import of the broker from here would compile
      # perfectly and only fail when someone bundles it, downstream, weeks later. It has already
      # happened three times in mesh-api, each one found by a person building a UI rather than by
      # a check.
      #
      # `./browser` is deliberately NOT tested here. It is named for the browser and does not
      # bundle for one — it exports ServiceBroker and takes express with it. That is a real bug,
      # filed separately; asserting it now would just pin a known-broken entry.
      - name: The contracts entry stays browser-safe
        run: |
          set -euo pipefail
          npx --yes esbuild@0.28.2 dist/contracts.js \
            --bundle --platform=browser --format=esm \
            --outfile=/tmp/contracts-browser-check.js

          # Inspect the OUTPUT, do not rely on the bundle failing.
          #
          # A resolution error was the obvious check and it does not work: esbuild marks `node:`
          # builtins external for a browser target rather than erroring, so a bundle that imports
          # node:async_hooks succeeds and exits 0. Adding a used ContextStack import here — a real
          # leak of the exact shape this guards against — produced a clean exit and a bundle with
          # `"node:async_hooks"` sitting in it.
          #
          # So assert on what came out. This one is demonstrable: with the leak the grep finds
          # node:async_hooks, without it the bundle contains no builtin at all.
          if grep -oE '"node:[a-z_]+"' /tmp/contracts-browser-check.js | sort -u | grep .; then
            echo
            echo "FAIL: the contracts entry reached a Node builtin — something in it, or something"
            echo "it imports, belongs to the server half. See src/contracts.ts."
            exit 1
          fi
          echo "no Node builtins reached. bundled: $(wc -c < /tmp/contracts-browser-check.js) bytes"
